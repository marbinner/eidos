[package]
name = "eidos"
version = "0.1.0"
edition = "2021"
description = "Interactive, GPU-rendered explorations of linear algebra, calculus, statistics and neural networks"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
egui-wgpu = "0.37"
wgpu = "30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "Location",
    "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "MessageChannel", "MessagePort", "ErrorEvent",
    "DedicatedWorkerGlobalScope", "WorkerGlobalScope",
] }

# Shipping build: maximum optimisation.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Fast-iteration build: optimised code, quick links.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 32
incremental = true
# (the tests in tests/ link the library, and a test must be able to catch a panic)
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
# Index loops that walk several arrays at once are how the numerical code reads best.
needless_range_loop = "allow"
# `x.min(hi).max(lo)` is deliberate where it appears: unlike `clamp` it swallows a NaN
# and cannot panic if the bounds cross, and a panic here ends the whole program.
manual_clamp = "allow"

# Code that runs once (translating and checking shaders at start-up, drawing a glyph
# the first time it is needed) is built for size rather than speed in the shipping
# build: it is a third of the download, and none of it is in any inner loop.
[profile.release.package.naga]
opt-level = "z"
[profile.release.package.wgpu-core]
opt-level = "s"
[profile.release.package.wgpu-hal]
opt-level = "s"
[profile.release.package.skrifa]
opt-level = "s"
[profile.release.package.vello_cpu]
opt-level = "s"
[profile.release.package.vello_common]
opt-level = "s"
[profile.release.package.kurbo]
opt-level = "s"
[profile.release.package.codespan-reporting]
opt-level = "z"
[profile.release.package.read-fonts]
opt-level = "s"
