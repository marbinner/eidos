<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>eidos: mathematics you can touch</title>
  <meta name="description" content="Interactive pictures of linear algebra, calculus, dynamics, statistics, Hermite polynomials and neural networks. Everything is computed and drawn live in your browser.">
  <meta name="theme-color" content="#07090f">
  <!-- how a link to this page looks when it is shared -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="eidos: mathematics you can touch">
  <meta property="og:description" content="Interactive pictures of linear algebra, calculus, dynamics, statistics, Hermite polynomials and neural networks, drawn live in your browser.">
  <meta property="og:url" content="https://marbinner.github.io/eidos/">
  <meta property="og:image" content="https://marbinner.github.io/eidos/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090c14'/%3E%3Cpath d='M8 34c8-26 16-26 24 0s16 26 24 0' fill='none' stroke='%234cc9f0' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='34' r='5' fill='%23ffd166'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07090f; color: #e6eaf2;
                 font: 15px/1.5 system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; }
    #loading b { font-size: 28px; font-weight: 600; letter-spacing: 0.02em; }
    #loading span { color: #8792a8; }
  </style>
</head>
<body>
  <canvas id="eidos" tabindex="0"></canvas>
  <div id="loading"><div><b>eidos</b><br><span>loading… (about 3 MB, once)</span></div></div>
  <noscript><div style="position:fixed;inset:0;display:grid;place-items:center">eidos needs JavaScript and WebGPU or WebGL2.</div></noscript>
  <script type="module">
    import init from "./pkg/eidos.js";
    init().catch((e) => {
      document.getElementById("loading").innerHTML =
        "<div><b>eidos could not start</b><br><span>" + e + "</span></div>";
    });
  </script>
</body>
</html>
